<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK Studio - Highly Secure Client Access</title>
    <style>
        /* =========================================
           RK STUDIO PREMIUM 3D UI & GLASSMORPHISM
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #050505;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, transparent 50%);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1500px;
        }

        /* 3D Container */
        .secure-container {
            position: relative;
            width: 95%;
            max-width: 1000px;
            background: rgba(20, 20, 25, 0.6);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 
                0 50px 100px rgba(0, 0, 0, 0.8),
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                inset 0 -1px 1px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transform: rotateX(5deg) translateY(-10px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 10;
        }

        .secure-container:hover {
            transform: rotateX(0deg) translateY(0px) scale(1.02);
            box-shadow: 
                0 60px 120px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(0, 123, 255, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-box h1 {
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0, 114, 255, 0.3);
        }

        .header-box p {
            color: #8892b0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Custom Video Player Area */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        video {
            width: 100%;
            display: block;
            pointer-events: none; /* Disable right click on video completely */
        }

        /* Transparent overlay over video to block interactions */
        .interaction-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 60px); /* Leave space for custom controls */
            z-index: 20;
        }

        .watermark {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 25;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Custom Controls to avoid download button */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 30;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .play-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 114, 255, 0.5);
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #00c6ff;
            width: 0%;
            border-radius: 10px;
            box-shadow: 0 0 10px #00c6ff;
        }

        .time-display {
            font-size: 0.85rem;
            color: #ccc;
            font-weight: 600;
        }

        /* Extreme Security Overlay */
        #security-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #security-shield.triggered {
            opacity: 1;
            pointer-events: all;
        }

        .shield-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pulse-red 1s infinite alternate;
        }

        .shield-text {
            color: #ff3333;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .shield-desc {
            color: #fff;
            font-size: 1.2rem;
            margin-top: 15px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
            100% { transform: scale(1.1); text-shadow: 0 0 40px rgba(255, 0, 0, 1); }
        }

    </style>
</head>
<body>

    <!-- Security Overlay when recording/tab switching is detected -->
    <div id="security-shield">
        <div class="shield-icon">🛑</div>
        <div class="shield-text">Security Violation</div>
        <div class="shield-desc">
            RK Studio content protection is active.<br>
            Screen recording, screenshots, or background activity has been detected. Playback is paused.
        </div>
    </div>

    <!-- Main 3D UI -->
    <div class="secure-container">
        <div class="header-box">
            <h1>RK Studio</h1>
            <p>End-to-End Encrypted Client Preview</p>
        </div>

        <div class="video-wrapper">
            <div class="watermark">RK Studio</div>
            
            <!-- This div blocks right clicks directly on the video -->
            <div class="interaction-blocker"></div>

            <video id="clientVideo" preload="auto">
                <source src="https://www.image2url.com/r2/default/videos/1793026033487-4c04b685-feda-4a79-bf9c-d08d33640c85.mp4" type="video/mp4">
            </video>

            <!-- Custom Built Controls -->
            <div class="custom-controls">
                <button class="play-btn" id="playPauseBtn">▶</button>
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           RK STUDIO ADVANCED JAVASCRIPT SECURITY
           ========================================= */

        const video = document.getElementById('clientVideo');
        const shield = document.getElementById('security-shield');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        // --- 1. Custom Player Logic ---
        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.innerHTML = '⏸';
            } else {
                video.pause();
                playPauseBtn.innerHTML = '▶';
            }
        });

        video.addEventListener('timeupdate', () => {
            const percentage = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${percentage}%`;
            currentTimeEl.textContent = formatTime(video.currentTime);
        });

        video.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(video.duration);
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        // --- 2. ANTI-SCREENSHOT & ANTI-RECORDING LOGIC ---

        function triggerSecurityLock() {
            video.pause();
            playPauseBtn.innerHTML = '▶';
            shield.classList.add('triggered');
        }

        function releaseSecurityLock() {
            shield.classList.remove('triggered');
        }

        // A. Tab badalne par ya notification bar kholne par
        document.addEventListener("visibilitychange", () => {
            if (document.hidden || document.visibilityState === 'hidden') {
                triggerSecurityLock();
            }
        });

        // B. Window blur hone par (Koi overlay app aane par)
        window.addEventListener('blur', triggerSecurityLock);
        window.addEventListener('focus', releaseSecurityLock);

        // --- 3. ANTI-DOWNLOAD & ANTI-DEVTOOLS LOGIC ---

        // Disable right click everywhere
        document.addEventListener('contextmenu', event => {
            event.preventDefault();
            triggerSecurityLock();
            setTimeout(releaseSecurityLock, 2000);
        });

        // Disable specific keyboard shortcuts (F12, Ctrl+S, PrintScreen, etc)
        document.addEventListener('keydown', (e) => {
            if (
                e.key === 'PrintScreen' || 
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
                (e.ctrlKey && (e.key === 'U' || e.key === 'S' || e.key === 'P')) ||
                (e.metaKey && e.shiftKey && e.key === '4') // Mac screenshot
            ) {
                e.preventDefault();
                navigator.clipboard.writeText("Protected by RK Studio"); // Clear clipboard
                triggerSecurityLock();
            }
        });

        // Anti-Debugger Loop (Agar koi inspect element open karega to browser freeze ho jayega)
        setInterval(function() {
            const before = new Date().getTime();
            debugger; // Devtools open hoga tabhi yahan rukega
            const after = new Date().getTime();
            if (after - before > 100) {
                triggerSecurityLock();
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%'>SECURITY BREACH DETECTED</h1>";
            }
        }, 1000);

        // Prevent dragging the video out
        document.addEventListener('dragstart', (e) => {
            e.preventDefault();
        });

    </script>
</body>
</html>
